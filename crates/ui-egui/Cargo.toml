[package]
name = "logocraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LogoCraft egui frontend (menus, panels, tools and canvas); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
logocraft-geom = { workspace = true }
logocraft-color = { workspace = true }
logocraft-doc = { workspace = true }
logocraft-brush = { workspace = true }
logocraft-render = { workspace = true }
logocraft-text = { workspace = true }
logocraft-tools = { workspace = true }
logocraft-engine = { workspace = true }
logocraft-svg = { workspace = true }
logocraft-effects = { workspace = true }
logocraft-pdf = { workspace = true }
logocraft-eps = { workspace = true }
logocraft-format = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
logocraft-testkit = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
