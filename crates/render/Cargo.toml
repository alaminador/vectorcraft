[package]
name = "logocraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LogoCraft renderer: document to pixels (vello_cpu backend)"

[lints]
workspace = true

[dependencies]
logocraft-geom = { workspace = true }
logocraft-color = { workspace = true }
logocraft-doc = { workspace = true }
logocraft-text = { workspace = true }
logocraft-effects = { workspace = true }
logocraft-brush = { workspace = true }
vello_cpu = { workspace = true }
# Filter types (Gaussian blur, drop shadow) are not re-exported by vello_cpu 0.2.
vello_common = { version = "0.2", default-features = false }
gif = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
jpeg-encoder = { workspace = true }
# TIFF LZW compression (MIT OR Apache-2.0; already used by the image crate's TIFF reader).
weezl = "0.1"
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

[dev-dependencies]
logocraft-testkit = { workspace = true }
# Decoders the export tests read their files back with.
image = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
