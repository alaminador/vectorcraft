[package]
name = "logocraft-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LogoCraft Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
logocraft-geom = { workspace = true }
logocraft-color = { workspace = true }
logocraft-doc = { workspace = true }
logocraft-effects = { workspace = true }
logocraft-brush = { workspace = true }
logocraft-text = { workspace = true }
# Non-native art in Illustrator editing data (a placed PDF's content, kept as a PDF).
logocraft-pdf = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
logocraft-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }

[dev-dependencies]
logocraft-testkit = { workspace = true }
